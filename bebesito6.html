<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebesito Semanario</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f7fffb; 
            color: #555; 
            padding: 20px; 
            margin: 0; 
        }
        .card { 
            background: white; 
            border-radius: 25px; 
            padding: 30px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            max-width: 350px; 
            margin: 40px auto; 
            border: 1px solid #b8e0d2; 
        }
        h1 { 
            color: #72a98f; 
            font-size: 1.6rem; 
            margin: 10px 0; 
            font-weight: 600; 
        }
        .semana { 
            font-size: 1.1rem; 
            background: #b8e0d2; 
            color: #444; 
            display: inline-block; 
            padding: 6px 18px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            font-weight: bold; 
        }
        .fruta { 
            font-size: 2.2rem; 
            font-weight: bold; 
            color: #333; 
            margin: 15px 0; 
            text-transform: capitalize; 
        }
        .img-container { 
            width: 100%; 
            height: 250px; 
            margin-top: 25px; 
            border-radius: 20px; 
            overflow: hidden; 
            background-color: #f0fdf7; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 4px solid #b8e0d2; 
        }
        img { width: 100%; height: 100%; object-fit: cover; }
        .emoji-fallback { font-size: 120px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="semana" id="semana-texto">Calculando...</div>
        <h1>Bebesito es un...</h1>
        <div class="fruta" id="nombre-fruta"></div>
        <div class="img-container" id="imagen-contenedor">
            <span id="cargando">Buscando foto...</span>
        </div>
    </div>

    <script>
        // Lista optimizada con términos de búsqueda en inglés para Pixabay
        const listaFrutas = {
            4: {es: "Semilla de amapola", en: "poppy seed", emoji: "🌱"}, 
            5: {es: "Semilla de sésamo", en: "sesame seed", emoji: "🌱"}, 
            6: {es: "Grano de arroz", en: "rice grain", emoji: "🍚"}, 
            7: {es: "Arándano", en: "blueberry", emoji: "🫐"},
            8: {es: "Habichuela", en: "green bean", emoji: "🫛"}, 
            9: {es: "Cereza", en: "cherry", emoji: "🍒"}, 
            10: {es: "Uva", en: "grape", emoji: "🍇"}, 
            11: {es: "Higo", en: "fig fruit", emoji: "🍯"}, 
            12: {es: "Lima", en: "lime fruit", emoji: "🍋"}, 
            13: {es: "Naranja", en: "orange fruit", emoji: "🍊"},
            14: {es: "Melocotón", en: "peach", emoji: "🍑"}, 
            15: {es: "Manzana", en: "apple fruit", emoji: "🍎"}, 
            16: {es: "Aguacate", en: "avocado", emoji: "🥑"}, 
            17: {es: "Pera", en: "pear", emoji: "🍐"}, 
            18: {es: "Pimiento", en: "bell pepper", emoji: "🫑"},
            19: {es: "Pomelo", en: "grapefruit", emoji: "🍊"}, 
            20: {es: "Coco", en: "coconut", emoji: "🥥"}, 
            21: {es: "Zanahoria", en: "carrot", emoji: "🥕"}, 
            22: {es: "Papaya", en: "papaya fruit", emoji: "🥭"}, 
            23: {es: "Berenjena", en: "eggplant", emoji: "🍆"},
            24: {es: "Maíz", en: "corn cob", emoji: "🌽"}, 
            25: {es: "Colinabo", en: "kohlrabi", emoji: "🍠"}, 
            26: {es: "Pepino", en: "cucumber", emoji: "🥒"}, 
            27: {es: "Coliflor", en: "cauliflower", emoji: "🥦"}, 
            28: {es: "Lechuga", en: "lettuce", emoji: "🥬"},
            29: {es: "Calabaza moscada", en: "butternut squash", emoji: "🎃"}, 
            30: {es: "Repollo", en: "cabbage", emoji: "🥗"}, 
            31: {es: "Col china", en: "bok choy", emoji: "🥬"}, 
            32: {es: "Jícama", en: "jicama", emoji: "🥔"}, 
            33: {es: "Piña", en: "pineapple", emoji: "🍍"},
            34: {es: "Melón cantalupo", en: "cantaloupe", emoji: "🍈"}, 
            35: {es: "Melón amarillo", en: "yellow melon", emoji: "🍈"}, 
            36: {es: "Melón", en: "honeydew melon", emoji: "🍈"}, 
            37: {es: "Acelga", en: "swiss chard", emoji: "🌿"},
            38: {es: "Puerro", en: "leek", emoji: "🧅"}, 
            39: {es: "Sandía", en: "watermelon", emoji: "🍉"}, 
            40: {es: "Calabaza", en: "pumpkin", emoji: "🎃"}
        };

        async function cargarImagen(terminoBusqueda, emojiFallback) {
            const apiKey = '43452243-7f2a746535f2991054238e886'; 
            // Buscamos con el término en inglés para mejores resultados
            const url = `https://pixabay.com/api/?key=${apiKey}&q=${encodeURIComponent(terminoBusqueda)}&image_type=photo&orientation=horizontal&safesearch=true`;
            
            const contenedor = document.getElementById('imagen-contenedor');

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.hits && data.hits.length > 0) {
                    contenedor.innerHTML = `<img src="${data.hits[0].webformatURL}" alt="${terminoBusqueda}">`;
                } else {
                    contenedor.innerHTML = `<span class="emoji-fallback">${emojiFallback}</span>`;
                }
            } catch (error) {
                contenedor.innerHTML = `<span class="emoji-fallback">${emojiFallback}</span>`;
            }
        }

        function calcularYMostrar() {
            const fechaInicio = new Date(2025, 11, 20); 
            const fechaActual = new Date();
            
            const milisegundosPorSemana = 1000 * 60 * 60 * 24 * 7;
            const diferenciaMilisegundos = fechaActual - fechaInicio;
            const semana = Math.floor(diferenciaMilisegundos / milisegundosPorSemana);
            
            const info = listaFrutas[semana];

            if (info) {
                document.getElementById('semana-texto').innerText = `Semana ${semana}`;
                document.getElementById('nombre-fruta').innerText = info.es;
                cargarImagen(info.en, info.emoji);
            } else {
                document.getElementById('semana-texto').innerText = `Semana ${semana}`;
                document.getElementById('nombre-fruta').innerText = "¡Bebé en camino!";
                document.getElementById('imagen-contenedor').innerHTML = `<span class="emoji-fallback">👶</span>`;
            }
        }

        calcularYMostrar();
    </script>
</body>
</html>
